[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schwab-py"
dynamic = ["version"]
description = "Unofficial API wrapper for the Schwab HTTP API"
readme = {file = "README.rst", content-type = "text/x-rst"}
authors = [{name = "Alex Golec", email = "bottomless.septic.tank@gmail.com"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["finance", "trading", "equities", "bonds", "options", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Development Status :: 5 - Production/Stable",
    "Natural Language :: English",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "autopep8",
    "authlib>=1.6.0",
    "certifi>=2025.6.15",
    "flask",
    "httpx>=0.28.1",
    "multiprocess",
    "psutil",
    "urllib3",
    "websockets>=13.0",
]

[project.optional-dependencies]
# authlib is migrating from httpx to httpx2 and uses httpx2 when it is
# installed. schwab-py follows whichever authlib uses.
httpx2 = ["httpx2"]
dev = [
    "build",
    "callee",
    "colorama",
    "coverage",
    "mypy",
    "pytest",
    "pytz",
    "sphinx_rtd_theme",
    "twine",
]

[project.urls]
Documentation = "https://schwab-py.readthedocs.io/en/latest/"
Source = "https://github.com/alexgolec/schwab-py"
Tracker = "https://github.com/alexgolec/schwab-py/issues"

[tool.setuptools]
script-files = [
    "bin/schwab-order-codegen.py",
    "bin/schwab-generate-token.py",
]

[tool.setuptools.package-data]
schwab = ["py.typed", "client/*.pyi"]

[tool.setuptools.dynamic]
version = {attr = "schwab.version.version"}

[tool.setuptools.packages.find]
include = ["schwab*"]

[tool.mypy]
python_version = "3.10"
files = ["schwab", "tests/typing"]
ignore_missing_imports = true
